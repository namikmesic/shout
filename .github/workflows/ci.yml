# Builds Shout and runs the tests on every pull request and every push to main.
name: CI

on:
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

# A newer push to the same branch replaces the run in progress (macOS minutes are billed).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # The same Xcode as the Mac the app is developed on.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --skip-build
